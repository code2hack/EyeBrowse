<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Unsupported destinations</title>
<style>body { font: 16px/1.5 sans-serif; margin: 16px; } a { display: block; padding: 10px 0; }</style>
</head>
<body>
<h1 id="page-title">Unsupported destinations</h1>
<p>Load marker: <span id="load-marker" class="marker" data-testid="load-marker">{{LOAD_ID}}</span></p>
<p>Activating any link below must leave this document and its marker unchanged.</p>
<a id="dest-javascript" href="javascript:document.title='javascript-ran'">javascript: destination</a>
<a id="dest-content" href="content://com.example.fixture/item">content: destination</a>
<a id="dest-intent" href="intent://scan/#Intent;scheme=zxing;end">intent: destination</a>
<a id="dest-file" href="file:///etc/hosts">file: destination</a>
<a id="dest-mailto" href="mailto:fixture@example.invalid">mailto: destination</a>
<a id="dest-data" href="data:text/html,unsupported-data-destination">data: destination</a>
<p><a id="link-home" href="/">Back to fixture index</a></p>
<script>window.fixtureInfo = { loadId: "{{LOAD_ID}}", path: "{{PATH}}" };</script>
</body>
</html>
