<!doctype html>

<label>Textarea<textarea id="multiline">aé中🙂z</textarea></label>
<label>Plain<div id="plain" contenteditable="true">aé中🙂z</div></label>
<div style="height:120px">Field reveal context</div>

window.fixtureInputs=0; window.fixtureSubmits=0; window.fixtureIdentity=String(Math.random());
