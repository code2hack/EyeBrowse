<!doctype html>
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark">
<title>RG local editor fixture</title>
<style>
html,body { background:#000; color:#fff; margin:0; font:16px sans-serif; color-scheme:dark }
label { display:block; margin:8px; height:52px }
input,textarea,[contenteditable] { display:block; width:96%; height:28px; box-sizing:border-box; background:#000; color:#fff; border:1px solid #888; font:16px sans-serif; white-space:pre-wrap }
button { background:#000; color:#fff; border:1px solid #888 }
</style>
<form action="/submit" id="form"><label>Text<input id="text" autocomplete="off"></label><button id="send" type="submit">Submit harmless form</button></form>
<label>Other text<input id="other" autocomplete="off"></label>
<label>Password<input id="password" type="password" autocomplete="off"></label>
<label>Multiline<textarea id="multiline"></textarea></label>
<label>Plain<div id="plain" contenteditable="true"></div></label>
<a href="/history.html">History page</a>
<p id="dynamic">Dynamic content</p><button id="change" onclick="document.getElementById('dynamic').textContent='Changed locally'">Change content</button>
<div style="height:900px">Scroll area</div>
<script>
window.fixtureInputs=0;window.fixtureSubmits=0;
window.fixtureIdentity=String(Math.random());
document.addEventListener('input',()=>fixtureInputs++);
document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();fixtureSubmits++});
</script>
