name: Expert I6-T03 JVM metrics 34aa1fa8

on:
  push:
    branches:
      - expert/gates-i6-t03-evict-20260921

permissions:
  contents: read

jobs:
  jvm-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout exact Expert candidate
        uses: actions/checkout@v4
        with:
          ref: 34aa1fa8eed3d74a7ec7e5ea6b2fcaf3b8dce21b
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Verify exact SHA binding
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "34aa1fa8eed3d74a7ec7e5ea6b2fcaf3b8dce21b"
          chmod +x ./gradlew
      - name: Run all JVM test tasks
        shell: bash
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            :core:browser:test \
            :core:link:test \
            :app-phone:testDebugUnitTest \
            :app-rg:testDebugUnitTest
      - name: Count JUnit results
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True)
          tests = failures = errors = skipped = 0
          for path in files:
              root = ET.parse(path).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          print(f'JVM_TEST_XML_FILES={len(files)}')
          print(f'JVM_TESTS={tests}')
          print(f'JVM_FAILURES={failures}')
          print(f'JVM_ERRORS={errors}')
          print(f'JVM_SKIPPED={skipped}')
          assert files, 'no JUnit XML files found'
          assert failures == 0 and errors == 0 and skipped == 0
          PY
