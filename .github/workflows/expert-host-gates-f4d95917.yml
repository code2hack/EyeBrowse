name: Expert host gates 1fc5e2b7

on:
  push:
    branches:
      - expert/gates-f4d95917-20260920

permissions:
  contents: read

jobs:
  host-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout exact implementation candidate
        uses: actions/checkout@v4
        with:
          ref: 1fc5e2b7e1db8c751805dc880d34389372959dbd
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Verify exact candidate binding
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "1fc5e2b7e1db8c751805dc880d34389372959dbd"
          chmod +x ./gradlew
          java -version
          ./gradlew --version

      - name: JVM builds and tests
        id: jvm
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            :core:browser:build :core:link:build test

      - name: Report JVM test totals
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET
          total = failed = errors = skipped = 0
          files = list(Path(".").glob("**/build/test-results/test/*.xml"))
          for p in files:
              try:
                  r = ET.parse(p).getroot()
              except Exception:
                  continue
              total += int(r.attrib.get("tests", 0))
              failed += int(r.attrib.get("failures", 0))
              errors += int(r.attrib.get("errors", 0))
              skipped += int(r.attrib.get("skipped", 0))
          print(f"JVM_TEST_XML files={len(files)} tests={total} failures={failed} errors={errors} skipped={skipped}")
          PY

      - name: Phone and RG debug plus androidTest assembly
        id: android_build
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            :app-phone:assembleDebug :app-rg:assembleDebug \
            :app-phone:assembleDebugAndroidTest :app-rg:assembleDebugAndroidTest

      - name: Phone and RG lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            :app-phone:lintDebug :app-rg:lintDebug

      - name: Gate summary
        if: always()
        shell: bash
        run: |
          echo "JVM=${{ steps.jvm.outcome }}"
          echo "ANDROID_BUILD=${{ steps.android_build.outcome }}"
          echo "LINT=${{ steps.lint.outcome }}"
          test "${{ steps.jvm.outcome }}" = "success"
          test "${{ steps.android_build.outcome }}" = "success"
          test "${{ steps.lint.outcome }}" = "success"
