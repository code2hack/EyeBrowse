name: Expert diagnose B4 stages 1fc5e2b7

on:
  push:
    branches:
      - expert/gates-f4d95917-20260920

permissions:
  contents: read

jobs:
  diagnose-b4-stages:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout exact implementation candidate
        uses: actions/checkout@v4
        with:
          ref: 1fc5e2b7e1db8c751805dc880d34389372959dbd
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Verify exact candidate binding
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "1fc5e2b7e1db8c751805dc880d34389372959dbd"
          chmod +x ./gradlew

      - name: Add stage timing to assertion in working tree only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("core/link/src/test/kotlin/com/code2hack/eyebrowse/core/link/transport/LinkCancellationAndTrustTest.kt")
          s = p.read_text()
          old = '''        val elapsedMs = TimeUnit.NANOSECONDS.toMillis(System.nanoTime() - started)

        assertEquals(LinkError.AuthenticationFailed, failure)'''
          new = '''        val elapsedMs = TimeUnit.NANOSECONDS.toMillis(System.nanoTime() - started)
        val authStartedDeltaMs = client.stateTimesNanos[PairingState.AUTHENTICATING]
            ?.let { TimeUnit.NANOSECONDS.toMillis(it - started) } ?: -1

        assertEquals(LinkError.AuthenticationFailed, failure)'''
          if old not in s:
              raise SystemExit("elapsed anchor missing")
          s = s.replace(old, new)
          old2 = '''"elapsed=${elapsedMs}ms budget=${tight.operationBudgetMs}ms tcp=${tcpElapsedMs.get()}ms",'''
          new2 = '''"elapsed=${elapsedMs}ms budget=${tight.operationBudgetMs}ms tcp=${tcpElapsedMs.get()}ms authStart=${authStartedDeltaMs}ms",'''
          if old2 not in s:
              raise SystemExit("message anchor missing")
          p.write_text(s.replace(old2, new2))
          PY

      - name: Run B3/B4 class and print failure XML
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            :core:link:test --tests 'com.code2hack.eyebrowse.core.link.transport.LinkCancellationAndTrustTest'
          rc=$?
          echo "---- JUnit failure XML ----"
          for f in core/link/build/test-results/test/TEST-*.xml; do
            grep -n -A10 -B2 '<failure' "$f" || true
          done
          exit "$rc"
