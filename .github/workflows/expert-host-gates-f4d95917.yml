name: Expert targeted B3 B4 af92eae2

on:
  push:
    branches:
      - expert/gates-f4d95917-20260920

permissions:
  contents: read

jobs:
  targeted-b3-b4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout exact implementation candidate
        uses: actions/checkout@v4
        with:
          ref: af92eae2973b70b05e3434717b1e3a9b80695fe1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Verify exact candidate binding
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "af92eae2973b70b05e3434717b1e3a9b80695fe1"
          chmod +x ./gradlew

      - name: Run B3 B4 regression class
        shell: bash
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            :core:link:test --tests 'com.code2hack.eyebrowse.core.link.transport.LinkCancellationAndTrustTest'
