name: Expert full host gates af92eae2

on:
  push:
    branches:
      - expert/gates-f4d95917-20260920

permissions:
  contents: read

jobs:
  host-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout exact corrected implementation candidate
        uses: actions/checkout@v4
        with:
          ref: af92eae2973b70b05e3434717b1e3a9b80695fe1
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Verify exact candidate binding
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "af92eae2973b70b05e3434717b1e3a9b80695fe1"
          chmod +x ./gradlew
          java -version
          ./gradlew --version

      - name: JVM tests and JVM module builds
        id: jvm
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g             :core:browser:build             :core:link:build             :app-phone:testDebugUnitTest             :app-rg:testDebugUnitTest

      - name: Phone and RG debug plus androidTest assembly
        id: builds
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g             :app-phone:assembleDebug             :app-rg:assembleDebug             :app-phone:assembleDebugAndroidTest             :app-rg:assembleDebugAndroidTest

      - name: Phone and RG lint
        id: lint
        continue-on-error: true
        shell: bash
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g             :app-phone:lintDebug             :app-rg:lintDebug

      - name: Require all host gates
        shell: bash
        run: |
          echo "JVM=${{ steps.jvm.outcome }}"
          echo "BUILDS=${{ steps.builds.outcome }}"
          echo "LINT=${{ steps.lint.outcome }}"
          test "${{ steps.jvm.outcome }}" = success
          test "${{ steps.builds.outcome }}" = success
          test "${{ steps.lint.outcome }}" = success
