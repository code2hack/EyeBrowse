name: Expert diagnose B4 f4d95917

on:
  push:
    branches:
      - expert/gates-f4d95917-20260920

permissions:
  contents: read

jobs:
  diagnose-b4:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout exact implementation candidate
        uses: actions/checkout@v4
        with:
          ref: f4d959174570243cb45cfa2b4432309c1aba2f23
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Verify exact candidate binding
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "f4d959174570243cb45cfa2b4432309c1aba2f23"
          chmod +x ./gradlew

      - name: Instrument assertion message in runner working tree only
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("core/link/src/test/kotlin/com/code2hack/eyebrowse/core/link/transport/LinkCancellationAndTrustTest.kt")
          s = p.read_text()
          old = '"operation exceeded configured budget plus 500 ms scheduling slack",'
          new = '"operation exceeded configured budget plus 500 ms scheduling slack: elapsed=${elapsedMs}ms budget=${tight.operationBudgetMs}ms",'
          if old not in s:
              raise SystemExit("assertion anchor missing")
          p.write_text(s.replace(old, new))
          PY

      - name: Run B3/B4 regression class and print JUnit failures
        shell: bash
        run: |
          set +e
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            :core:link:test --tests 'com.code2hack.eyebrowse.core.link.transport.LinkCancellationAndTrustTest'
          rc=$?
          echo "---- JUnit failure XML ----"
          for f in core/link/build/test-results/test/TEST-*.xml; do
            grep -n -A8 -B2 '<failure' "$f" || true
          done
          exit "$rc"
