        shell: bash
        run: |
          bash ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g --continue \
            :app-phone:lintDebug :app-rg:lintDebug | tee evidence/lint.log
      - name: Retain exact-head evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: i6-t04-trailing-frame-${{ needs.prepare.outputs.candidate }}
          path: |
            evidence/
            **/build/test-results/**/TEST-*.xml
          retention-days: 14
      - name: Require every gate
        if: always()
        shell: bash
        env:
          TARGETED: ${{ steps.targeted.outcome }}
          ABLATION: ${{ steps.ablation.outcome }}
          JVM: ${{ steps.jvm.outcome }}
          COUNTS: ${{ steps.counts.outcome }}
          BUILDS: ${{ steps.builds.outcome }}
          LINT: ${{ steps.lint.outcome }}
        run: |
          git diff --exit-code
          echo "TARGETED=$TARGETED ABLATION=$ABLATION JVM=$JVM COUNTS=$COUNTS BUILDS=$BUILDS LINT=$LINT"
          for status in "$TARGETED" "$ABLATION" "$JVM" "$COUNTS" "$BUILDS" "$LINT"; do test "$status" = success; done
