name: Expert I6-T04 hosting gates a58a464a

on:
  push:
    branches:
      - expert/gates-i6-t04-hosting-20260921

permissions:
  contents: read

jobs:
  host-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout exact Expert candidate
        uses: actions/checkout@v4
        with:
          ref: a58a464a9d5f8214f3796a4adaa797bec356b788
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android 35 platform and build tools
        shell: bash
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Verify exact SHA binding
        shell: bash
        run: |
          test "$(git rev-parse HEAD)" = "a58a464a9d5f8214f3796a4adaa797bec356b788"
          chmod +x ./gradlew
          java -version
          ./gradlew --version

      - name: Targeted WebView attachment regressions
        shell: bash
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            :app-phone:testDebugUnitTest \
            --tests "com.code2hack.eyebrowse.phone.BrowserAttachmentTransferTest"

      - name: Full JVM tests and JVM module builds
        shell: bash
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            :core:browser:build \
            :core:link:build \
            :app-phone:testDebugUnitTest \
            :app-rg:testDebugUnitTest

      - name: Count JUnit results
        shell: bash
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files = glob.glob('**/build/test-results/**/TEST-*.xml', recursive=True)
          tests = failures = errors = skipped = 0
          for p in files:
              root = ET.parse(p).getroot()
              tests += int(root.attrib.get('tests', 0))
              failures += int(root.attrib.get('failures', 0))
              errors += int(root.attrib.get('errors', 0))
              skipped += int(root.attrib.get('skipped', 0))
          print(f'JVM_TEST_XML_FILES={len(files)}')
          print(f'JVM_TESTS={tests}')
          print(f'JVM_FAILURES={failures}')
          print(f'JVM_ERRORS={errors}')
          print(f'JVM_SKIPPED={skipped}')
          assert files
          assert failures == 0 and errors == 0 and skipped == 0
          PY

      - name: Phone and RG debug plus androidTest assembly
        shell: bash
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            :app-phone:assembleDebug \
            :app-rg:assembleDebug \
            :app-phone:assembleDebugAndroidTest \
            :app-rg:assembleDebugAndroidTest

      - name: Phone and RG lint
        shell: bash
        run: |
          ./gradlew --no-daemon --max-workers=2 -Dorg.gradle.jvmargs=-Xmx2g \
            :app-phone:lintDebug \
            :app-rg:lintDebug
