# Build envelope for the v0.0.1 implementation slice (see docs/testing/phone-browser.md):
# two workers and a 2 GiB daemon heap. Command lines pass these explicitly as well.
org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false

android.useAndroidX=true
android.nonTransitiveRClass=true
